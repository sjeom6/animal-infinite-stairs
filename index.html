<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#11152f">
  <title>우리의 미니게임</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;background:#11152f;color:#fff}
    body{min-height:100vh;min-height:100dvh;overflow-x:hidden}.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;background:radial-gradient(circle at 15% 15%,#7357d855,transparent 35%),radial-gradient(circle at 85% 70%,#ff527755,transparent 32%),linear-gradient(155deg,#25295f,#11152f 65%)}
    .star{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff;animation:twinkle 2s ease-in-out infinite alternate}.star:nth-child(1){left:12%;top:18%}.star:nth-child(2){left:80%;top:11%;animation-delay:.7s}.star:nth-child(3){left:72%;top:82%;animation-delay:1.2s}.star:nth-child(4){left:22%;top:74%;animation-delay:.3s}@keyframes twinkle{to{opacity:.25;transform:scale(.55)}}
    main{position:relative;width:min(100% - 32px,940px);margin:auto;padding:max(42px,env(safe-area-inset-top)) 0 max(38px,env(safe-area-inset-bottom));text-align:center}.eyebrow{font-size:13px;font-weight:900;letter-spacing:4px;color:#aeb8ff}h1{margin:7px 0 9px;font-size:clamp(35px,8vw,62px);line-height:1.05;text-shadow:0 6px #0b0d20}header p{margin:0;color:#c4c9e8;font-weight:700}
    .games{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:38px}.card{position:relative;min-height:290px;border:2px solid #ffffff27;border-radius:28px;padding:25px 20px 20px;overflow:hidden;color:#fff;text-align:left;cursor:pointer;box-shadow:0 14px 30px #0005;transition:.18s transform,.18s border-color;-webkit-tap-highlight-color:transparent}.card:hover{transform:translateY(-7px);border-color:#ffffff99}.card:active{transform:scale(.98)}
    .card:nth-child(1){background:linear-gradient(145deg,#38b5e8,#2877c8)}.card:nth-child(2){background:linear-gradient(145deg,#735ee5,#332f8c)}.card:nth-child(3){background:linear-gradient(145deg,#f4aa35,#e24e58)}.icon{display:grid;place-items:center;width:88px;height:88px;margin-bottom:25px;border-radius:25px;background:#ffffff24;font-size:54px;box-shadow:inset 0 2px #ffffff44}.card h2{margin:0 0 7px;font-size:25px}.card p{margin:0;color:#ffffffcc;font-size:14px;font-weight:700;line-height:1.5}.play{position:absolute;right:18px;bottom:17px;padding:9px 14px;border-radius:99px;background:#fff;color:#24294f;font-size:13px;font-weight:1000}
    footer{margin-top:28px;color:#8e96c5;font-size:12px;font-weight:700}.player{position:fixed;inset:0;z-index:10;background:#000}.player[hidden]{display:none}.player iframe{display:block;width:100%;height:100%;border:0;background:#11152f}.home{position:absolute;z-index:2;top:max(10px,env(safe-area-inset-top));left:10px;border:0;border-radius:999px;padding:10px 15px;background:#10142ddd;color:#fff;font-size:14px;font-weight:900;box-shadow:0 4px 12px #0006;-webkit-tap-highlight-color:transparent}.home:active{transform:scale(.95)}
    @media(max-width:720px){main{width:min(100% - 24px,520px);padding-top:max(30px,env(safe-area-inset-top))}.games{grid-template-columns:1fr;margin-top:26px;gap:14px}.card{min-height:150px;padding:19px 84px 18px 18px}.icon{width:64px;height:64px;margin:0 0 12px;font-size:39px;border-radius:19px}.card h2{font-size:22px}.play{right:14px;bottom:50%;transform:translateY(50%);padding:11px}}
  </style>
</head>
<body>
  <div class="bg"><i class="star"></i><i class="star"></i><i class="star"></i><i class="star"></i></div>
  <main>
    <header><div class="eyebrow">SJEOM6 ARCADE</div><h1>우리의 미니게임</h1><p>게임을 고르고 바로 플레이하세요!</p></header>
    <section class="games" aria-label="게임 목록">
      <article class="card" role="button" tabindex="0" data-game="jump-rope.html"><div class="icon">🪢</div><h2>통통 줄넘기</h2><p>줄이 발밑을 지나기 전에<br>타이밍을 맞춰 점프!</p><span class="play">PLAY ▶</span></article>
      <article class="card" role="button" tabindex="0" data-game="infinite-stairs.html"><div class="icon">🐾</div><h2>동물 무한계단</h2><p>차오르는 물을 피해<br>빠르게 계단을 올라가세요.</p><span class="play">PLAY ▶</span></article>
      <article class="card" role="button" tabindex="0" data-game="dodge-money.html"><div class="icon">💰</div><h2>피해서 돈 벌자!</h2><p>위험을 요리조리 피하며<br>돈을 최대한 모아보세요.</p><span class="play">PLAY ▶</span></article>
    </section>
    <footer>PC · MOBILE WEB GAME COLLECTION</footer>
  </main>
  <section class="player" id="player" hidden><button class="home" id="home">← 게임 목록</button><iframe id="frame" title="선택한 게임" allow="autoplay; fullscreen"></iframe></section>
  <script>
    const player=document.querySelector('#player'),frame=document.querySelector('#frame'),home=document.querySelector('#home');
    function play(path,updateHistory=true){frame.src=path;player.hidden=false;document.body.style.overflow='hidden';if(updateHistory)history.pushState({game:path},'',`#${path}`)}
    function closeGame(updateHistory=true){frame.src='about:blank';player.hidden=true;document.body.style.overflow='';if(updateHistory&&location.hash)history.back()}
    document.querySelectorAll('.card').forEach(card=>{card.addEventListener('click',()=>play(card.dataset.game));card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();play(card.dataset.game)}})});
    home.addEventListener('click',()=>closeGame());addEventListener('popstate',()=>{if(!location.hash)closeGame(false)});
    const initial=location.hash.slice(1);if(['jump-rope.html','infinite-stairs.html','dodge-money.html'].includes(initial))play(initial,false);
  </script>
</body>
</html>
